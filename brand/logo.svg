<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Reliquary</title>
  <defs>
    <radialGradient id="night" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#22305a"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#080b16"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="128" y1="58" x2="384" y2="440">
      <stop offset="0" stop-color="#fbe7ad"/>
      <stop offset="0.45" stop-color="#e8b04a"/>
      <stop offset="1" stop-color="#a8611c"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3ff"/>
      <stop offset="1" stop-color="#9fb6e2"/>
    </linearGradient>
    <linearGradient id="gemTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f5ff"/>
      <stop offset="1" stop-color="#5fb4e8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fc4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fc4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <mask id="crescent">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="252" cy="268" r="56" fill="#fff"/>
      <circle cx="278" cy="249" r="49" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#night)"/>
    <g fill="#dfe8ff">
      <circle cx="92" cy="96" r="2.6" opacity=".7"/><circle cx="420" cy="132" r="2" opacity=".55"/>
      <circle cx="74" cy="300" r="1.8" opacity=".45"/><circle cx="438" cy="330" r="2.4" opacity=".6"/>
      <circle cx="392" cy="70" r="1.6" opacity=".5"/><circle cx="128" cy="176" r="1.4" opacity=".4"/>
    </g>
    <circle cx="256" cy="270" r="140" fill="url(#glow)"/>
  </g>
  <!-- the shrine: a gothic arch on a stepped plinth, with a finial -->
  <g fill="none" stroke="url(#gold)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M160 404 V236 C160 170 212 124 256 104 C300 124 352 170 352 236 V404" stroke-width="20"/>
    <path d="M188 404 V244 C188 196 224 160 256 142 C288 160 324 196 324 244 V404" stroke-width="5" opacity=".55"/>
    <path d="M128 404 H384" stroke-width="20"/>
    <path d="M150 434 H362" stroke-width="16"/>
  </g>
  <path d="M256 58 L272 82 L256 104 L240 82 Z" fill="url(#gold)"/>
  <!-- what it keeps: a crescent moon holding a cut gem -->
  <rect width="512" height="512" fill="url(#moon)" mask="url(#crescent)"/>
  <g transform="translate(262 286) scale(.82)">
    <path d="M0 -40 L30 -10 L0 40 L-30 -10 Z" fill="#3f8fd0"/>
    <path d="M0 -40 L30 -10 L0 -2 L-30 -10 Z" fill="url(#gemTop)"/>
    <path d="M0 -2 L30 -10 L0 40 Z" fill="#2c6fae"/>
    <path d="M0 -40 L-30 -10 L0 -2 Z" fill="#eaf8ff" opacity=".85"/>
    <path d="M0 -40 L30 -10 L0 40 L-30 -10 Z" fill="none" stroke="#fbe7ad" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
