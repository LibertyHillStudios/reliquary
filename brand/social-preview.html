<!doctype html>
<html><head><meta charset="utf-8"><title>Reliquary social preview</title>
<!-- The picture GitHub shows when the repository is linked (Settings, Social preview): 1280x640,
     photographed by Chromium to social-preview.png. -->
<style>
@font-face { font-family: Cinzel; src: url(../web/fonts/cinzel-variable.woff2) format("woff2"); font-weight: 400 900; }
@font-face { font-family: Sora; src: url(../web/fonts/sora-variable.woff2) format("woff2"); font-weight: 100 800; }
html, body { margin: 0; }
body { width: 1280px; height: 640px; overflow: hidden; position: relative; box-sizing: border-box; color: #f5ecd9; font-family: Sora, sans-serif;
  background: radial-gradient(120% 140% at 22% 38%, #22305a 0%, #121a33 48%, #080b16 100%); }
.main { position: absolute; left: 0; right: 0; top: 0; bottom: 96px; display: flex; align-items: center; justify-content: center; gap: 48px; }
.main img { width: 236px; height: 236px; filter: drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
h1 { margin: 0; font-family: Cinzel, serif; font-weight: 700; font-size: 112px; letter-spacing: .06em; line-height: 1;
  background: linear-gradient(135deg, #fbe7ad 0%, #e8b04a 50%, #b8702a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 20px 0 0 6px; font-size: 27px; letter-spacing: .02em; color: #bacdec; }
.foot { position: absolute; left: 64px; right: 64px; bottom: 44px; display: flex; align-items: center; justify-content: space-between;
  padding-top: 24px; border-top: 1px solid rgba(236,190,91,.22); }
.studio { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 22px; letter-spacing: -.005em; color: #f5ecd9; }
.studio img { width: 36px; height: 36px; }
.studio span { color: rgba(236,190,91,.9); font-weight: 600; font-size: 15px; letter-spacing: .24em; text-transform: uppercase; margin-left: 4px; }
.tag { font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: rgba(186,205,236,.8); }
</style></head>
<body>
<div class="main"><img src="logo.svg" alt=""><div><h1>Reliquary</h1><p>Every character you play, kept like a relic.</p></div></div>
<div class="foot"><div class="studio"><img src="../web/art/lhs-mark.svg" alt="">Liberty Hill Studios<span>libertyhillstudio.com</span></div>
<div class="tag">An addon for WoW: Forever · Apache 2.0</div></div>
</body></html>
