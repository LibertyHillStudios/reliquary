<!doctype html>
<html><head><meta charset="utf-8"><title>Reliquary banner</title>
<style>
@font-face { font-family: Cinzel; src: url(../web/fonts/cinzel-variable.woff2) format("woff2"); font-weight: 400 900; }
@font-face { font-family: Sora; src: url(../web/fonts/sora-variable.woff2) format("woff2"); font-weight: 100 800; }
html, body { margin: 0; }
body { width: 1280px; height: 360px; overflow: hidden; display: flex; align-items: center; gap: 44px; padding: 0 84px; box-sizing: border-box;
  background: radial-gradient(120% 140% at 18% 40%, #22305a 0%, #121a33 48%, #080b16 100%); color: #f5ecd9; font-family: Sora, sans-serif; }
img { width: 224px; height: 224px; filter: drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
h1 { margin: 0; font-family: Cinzel, serif; font-weight: 700; font-size: 104px; letter-spacing: .06em; line-height: 1;
  background: linear-gradient(135deg, #fbe7ad 0%, #e8b04a 50%, #b8702a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 18px 0 0 6px; font-size: 25px; font-weight: 400; letter-spacing: .02em; color: #bacdec; }
</style></head>
<body><img src="logo.svg" alt=""><div><h1>Reliquary</h1><p>Every character you play, kept like a relic.</p></div></body></html>
