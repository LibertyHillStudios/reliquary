<svg xmlns="http://www.w3.org/2000/svg" width="128" height="16" viewBox="0 0 128 16">
  <!-- The line of light that crosses the window's top border once as it opens: a streak, brightest
       at its middle, gone at its ends and edges. Drawn added to what is under it. -->
  <defs>
    <linearGradient id="along" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="across" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="128" height="16" fill="url(#across)"/></mask>
  </defs>
  <rect width="128" height="16" fill="url(#along)" mask="url(#m)"/>
</svg>
