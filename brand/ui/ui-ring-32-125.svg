<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The disc's outline, 1.25 pixels wide, tinted in the game: nine-sliced it is the one-pixel line round
       every rounded surface, drawn over its fill (Skin.lua picks the width that comes out one pixel on
       the screen), so a fading surface never shows its line's colour through the fill. -->
  <circle cx="16" cy="16" r="15.375" fill="none" stroke="#fff" stroke-width="1.25"/>
</svg>
