<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- The window's small glyphs, white and tinted in the game, each in a 64-pixel cell (16 units at
       four pixels a unit), read by Skin.lua's GLYPH table:
         row 1: close, chevron (right), chevron (down), magnifier
         row 2: plus, minus, clear, grip
         row 3: tick, the shrine's arch (from logo.svg), dot
       Other directions are the same cells turned by their texture coordinates. -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- close: a thin X -->
    <path d="M19 19 L45 45 M45 19 L19 45" stroke-width="4.5"/>
    <!-- chevron, pointing right -->
    <path d="M90 15 L107 32 L90 49" stroke-width="5.5" transform="translate(-2 0)"/>
    <!-- chevron, pointing down -->
    <path d="M143 24 L160 41 L177 24" stroke-width="5.5" transform="translate(0 -1)"/>
    <!-- magnifier -->
    <circle cx="219" cy="27" r="13" stroke-width="5"/>
    <path d="M228.5 36.5 L241 49" stroke-width="6"/>
    <!-- plus and minus -->
    <path d="M32 80 L32 112 M16 96 L48 96" stroke-width="5"/>
    <path d="M80 96 L112 96" stroke-width="5"/>
    <!-- grip: three lines along the corner's diagonal -->
    <path d="M246 82 L210 118 M246 96 L224 118 M246 110 L238 118" stroke-width="4"/>
    <!-- tick -->
    <path d="M15 162 L27 174 L49 149" stroke-width="6.5"/>
  </g>
  <!-- clear: a filled disc with an X cut through it -->
  <defs>
    <mask id="cut">
      <rect x="128" y="64" width="64" height="64" fill="#fff"/>
      <path d="M150 86 L170 106 M170 86 L150 106" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="160" cy="96" r="22" fill="#fff" mask="url(#cut)"/>
  <!-- the shrine's arch: logo.svg's arch, plinth and finial, drawn bolder to read small -->
  <g transform="translate(96 160) scale(0.125) translate(-256 -242)">
    <g fill="none" stroke="#fff" stroke-linejoin="round" stroke-linecap="round">
      <path d="M160 404 V236 C160 170 212 124 256 104 C300 124 352 170 352 236 V404" stroke-width="34"/>
      <path d="M118 410 H394" stroke-width="34"/>
    </g>
    <path d="M256 52 L276 80 L256 106 L236 80 Z" fill="#fff"/>
  </g>
  <!-- dot -->
  <circle cx="160" cy="160" r="14" fill="#fff"/>
</svg>
